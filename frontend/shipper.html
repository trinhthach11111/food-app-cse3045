<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kênh Vận Chuyển - VJU Food</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 30px; background: #ff9800; color: white; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
  </style>
</head>
<body>
  <header>
    <h2>🛵 Kênh Vận Chuyển (Shipper Dashboard)</h2>
    <div id="userProfile" style="display: flex; align-items: center; gap: 12px;"></div>
  </header>

  <main style="padding: 30px;">
    <h3>Danh sách đơn hàng cần giao</h3>
    <p>Hiện tại chưa có đơn hàng mới nào được phân công.</p>
  </main>

  <script>
    const userStr = localStorage.getItem('user_info');
    const user = userStr ? JSON.parse(userStr) : null;

    if (!user || user.role !== 'shipper') {
      alert("Bạn không có quyền truy cập Kênh Shipper!");
      window.location.href = '/login.html';
    } else {
      document.getElementById('userProfile').innerHTML = `
        <img src="${user.avatar_url || '/uploads/default-avatar.png'}" class="avatar" />
        <span>Tài xế: <b>${user.fullname || user.username}</b></span>
        <button onclick="logout()" style="padding: 6px 12px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">Đăng xuất</button>
      `;
    }

    function logout() {
      localStorage.removeItem('user_info');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
