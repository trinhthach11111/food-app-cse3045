<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kênh Shipper - Giao Hàng</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background: #f9f9f9;">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #ff9800; color: white;">
    <h2>Kênh Vận Chuyển (Shipper Dashboard)</h2>
    <div id="userProfile" style="display: flex; align-items: center; gap: 10px;"></div>
  </header>

  <main style="padding: 20px;">
    <h3>Danh sách Đơn hàng cần Giao</h3>
    <p>Hiện chưa có đơn hàng mới nào.</p>
  </main>

  <script>
    const user = JSON.parse(localStorage.getItem('user_info'));
    if (!user || user.role !== 'shipper') {
      alert("Bạn không có quyền truy cập kênh Shipper!");
      window.location.href = '/login.html';
    } else {
      document.getElementById('userProfile').innerHTML = `
        <img src="${user.avatar_url}" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; object-fit: cover;" />
        <span>Tài xế: <b>${user.fullname}</b></span>
        <button onclick="logout()" style="padding: 5px 10px; cursor: pointer;">Đăng xuất</button>
      `;
    }
    function logout() { localStorage.clear(); window.location.href = '/login.html'; }
  </script>
</body>
</html>
