<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký Tài khoản - VJU Food</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f6f9; }
    .card { background: white; padding: 30px; border-radius: 10px; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #ff5722; text-align: center; }
    label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-top: 10px; margin-bottom: 3px; }
    input, select, button { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #ff5722; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đăng Ký Tài Khoản</h2>
    <form id="registerForm" enctype="multipart/form-data">
      <input type="text" name="fullname" placeholder="Họ và tên" required />
      <input type="text" name="username" placeholder="Tên đăng nhập" required />
      <input type="email" name="email" placeholder="Địa chỉ Email" required />
      <input type="password" name="password" placeholder="Mật khẩu" required />
      
      <label>Chọn vai trò tài khoản:</label>
      <select name="role" required>
        <option value="customer">Người đặt hàng (Khách hàng)</option>
        <option value="seller">Người bán hàng (Chủ quán)</option>
        <option value="shipper">Người giao hàng (Shipper)</option>
      </select>

      <label>Chọn Ảnh đại diện (Avatar):</label>
      <input type="file" name="avatar" accept="image/*" />

      <button type="submit">Đăng Ký Ngay</button>
    </form>
    <p style="text-align: center;">Đã có tài khoản? <a href="/login.html" style="color:#2196f3; font-weight:bold;">Đăng nhập</a></p>
  </div>

  <script>
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/register', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          alert("✅ Đăng ký thành công! Tài khoản đã được lưu vào CSDL.\nĐang chuyển sang trang Đăng nhập...");
          window.location.href = '/login.html';
        } else {
          // Hiển thị chi tiết lỗi rõ ràng
          let errMsg = "Đăng ký thất bại: ";
          if (typeof data.detail === 'string') {
            errMsg += data.detail;
          } else if (Array.isArray(data.detail)) {
            errMsg += data.detail.map(d => d.msg).join(', ');
          } else {
            errMsg += JSON.stringify(data);
          }
          alert(errMsg);
        }
      } catch (err) {
        alert("Không thể kết nối đến máy chủ: " + err.message);
      }
    };
  </script>
</body>
</html>
