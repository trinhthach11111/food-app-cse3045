<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kênh Quản Lý Bán Hàng - VJU Food</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 30px; background: #2196F3; color: white; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
  </style>
</head>
<body>
  <header>
    <h2>🏪 Kênh Quản Lý Bán Hàng (Seller Dashboard)</h2>
    <div id="userProfile" style="display: flex; align-items: center; gap: 12px;"></div>
  </header>

  <main style="padding: 30px;">
    <h3>Quản lý thực đơn & cửa hàng</h3>
    <p>Chào mừng bạn đến với kênh dành riêng cho Chủ Quán!</p>
    <button style="padding: 10px 18px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">+ Thêm món ăn mới</button>
  </main>

  <script>
    const userStr = localStorage.getItem('user_info');
    const user = userStr ? JSON.parse(userStr) : null;

    if (!user || user.role !== 'seller') {
      alert("Bạn không có quyền truy cập Kênh Người Bán Hàng!");
      window.location.href = '/login.html';
    } else {
      document.getElementById('userProfile').innerHTML = `
        <img src="${user.avatar_url || '/uploads/default-avatar.png'}" class="avatar" />
        <span>Chủ quán: <b>${user.fullname || user.username}</b></span>
        <button onclick="logout()" style="padding: 6px 12px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">Đăng xuất</button>
      `;
    }

    function logout() {
      localStorage.removeItem('user_info');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
