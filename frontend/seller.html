<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kênh Quản Lý Bán Hàng - VJU Food</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f8f9fa; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #2196F3; color: white; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
    .container { padding: 30px; max-width: 1000px; margin: auto; }
    .btn-add { padding: 12px 20px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-add:hover { background: #45a049; }
    
    /* Style Bảng danh sách món ăn */
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #e3f2fd; color: #0d47a1; }
    .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }

    /* Modal Form Thêm Món */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .modal-content h3 { margin-top: 0; color: #2196F3; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-radius: 6px; box-sizing: border-box; }
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .btn-cancel { background: #888; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: #2196F3; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h2>🏪 Kênh Quản Lý Bán Hàng (Seller Dashboard)</h2>
    <div id="userProfile" style="display: flex; align-items: center; gap: 12px;"></div>
  </header>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Danh sách thực đơn quán</h3>
      <button class="btn-add" onclick="openModal()">+ Thêm món ăn mới</button>
    </div>

    <table id="productTable">
      <thead>
        <tr>
          <th>Ảnh</th>
          <th>Tên món ăn</th>
          <th>Giá bán</th>
          <th>Mô tả</th>
          <th>Trạng thái</th>
        </tr>
      </thead>
      <tbody id="productList">
        <tr><td colspan="5" style="text-align:center;">Đang tải danh sách món ăn...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Thêm Món -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>Thêm Món Ăn Mới</h3>
      <form id="addProductForm" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Tên món ăn (VD: Cơm gà sốt cay)" required />
        <input type="number" name="price" placeholder="Giá bán (VNĐ)" required />
        <textarea name="description" placeholder="Mô tả món ăn ngắn gọn" rows="3"></textarea>
        
        <label style="font-size: 13px; font-weight: bold; color: #555;">Ảnh món ăn:</label>
        <input type="file" name="image" accept="image/*" style="margin-top: 5px;" />

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Hủy</button>
          <button type="submit" class="btn-save">Lưu Món Mới</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const userStr = localStorage.getItem('user_info');
    const user = userStr ? JSON.parse(userStr) : null;

    if (!user || user.role !== 'seller') {
      alert("Bạn không có quyền truy cập Kênh Người Bán Hàng!");
      window.location.href = '/login.html';
    } else {
      document.getElementById('userProfile').innerHTML = `
        <img src="${user.avatar_url || '/uploads/default-avatar.png'}" class="avatar" />
        <span>Chủ quán: <b>${user.fullname || user.username}</b></span>
        <button onclick="logout()" style="padding: 6px 12px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Đăng xuất</button>
      `;
      loadProducts();
    }

    function logout() {
      localStorage.removeItem('user_info');
      window.location.href = '/login.html';
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    // Lấy danh sách món ăn từ API
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const products = await res.json();
        const tbody = document.getElementById('productList');
        tbody.innerHTML = '';

        if (!products || products.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Chưa có món ăn nào trong thực đơn.</td></tr>';
          return;
        }

        products.forEach(p => {
          tbody.innerHTML += `
            <tr>
              <td><img src="${p.image_url || '/images/default-food.jpg'}" class="img-preview" /></td>
              <td><b>${p.name}</b></td>
              <td style="color: #e91e63; font-weight: bold;">${Number(p.price).toLocaleString()} VNĐ</td>
              <td>${p.description || 'Không có mô tả'}</td>
              <td><span style="color: green; font-weight: bold;">Đang bán</span></td>
            </tr>
          `;
        });
      } catch (err) {
        console.error("Lỗi tải danh sách món:", err);
      }
    }

    // Gửi Form thêm món ăn mới
    document.getElementById('addProductForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/products', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          alert("✅ Thêm món ăn mới thành công!");
          closeModal();
          e.target.reset();
          loadProducts(); // Tải lại bảng danh sách
        } else {
          alert("❌ Không thể thêm món: " + (data.detail || "Đã xảy ra lỗi"));
        }
      } catch (err) {
        alert("Lỗi kết nối máy chủ: " + err.message);
      }
    };
  </script>
</body>
</html>
